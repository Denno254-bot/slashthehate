<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Slash the Hate</title>

    <link
        rel="stylesheet"
        href="homepage.css"
    >

</head>


<body class="auth-body">


    <!-- =================================
         AUTH HEADER
    ================================== -->

    <header class="auth-header">

        <a
            href="homepage.html"
            class="auth-logo"
        >

          <a href="#" class="logo">
            SLASH<span>THE HATE</span>
        </a>
        </a>


        <a
            href="homepage.html"
            class="back-home"
        >
            ← Back to website
        </a>

    </header>



    <!-- =================================
         LOGIN
    ================================== -->

    <main class="auth-main">

        <div class="auth-card">


            <div class="auth-heading">

                <span class="section-label">
                    WELCOME BACK
                </span>


                <h1>
                    Sign in to
                    <span>Slash the Hate.</span>
                </h1>


                <p>
                    Access your account and continue
                    making the digital space better.
                </p>

            </div>



            <!-- LOGIN FORM -->

            <form id="loginForm">


                <div class="auth-form-group">

                    <label for="loginEmail">
                        Email address
                    </label>


                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="you@example.com"
                        required
                    >

                </div>



                <div class="auth-form-group">

                    <div class="password-label">

                        <label for="loginPassword">
                            Password
                        </label>


                        <a href="#">
                            Forgot password?
                        </a>

                    </div>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            id="showLoginPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>



                <label class="remember-option">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    <span>
                        Remember me
                    </span>

                </label>



                <button
                    type="submit"
                    class="auth-submit"
                >
                    Sign In →
                </button>

            </form>



            <!-- REGISTER -->

            <div class="auth-divider">

                <span>
                    OR
                </span>

            </div>


            <div class="auth-register">

                <p>
                    Don't have an account?
                </p>


                <a href="register.html">
                    Create an account
                </a>

            </div>


        </div>

    </main>



    <footer class="auth-footer">

        <p>
            © 2026 Slash the Hate.
            Educate. Respect. Connect.
        </p>

    </footer>


    <script src="auth.js"></script>

</body>

</html>
