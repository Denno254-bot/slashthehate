<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | Slash the Hate</title>

    <link
        rel="stylesheet"
        href="homepage.css"
    >

</head>


<body class="auth-body">


    <!-- =================================
         HEADER
    ================================== -->

    <header class="auth-header">

        <a
            href="homepage.html"
            class="auth-logo"
        >

            <span>SLASH</span>
            <span class="the">THE</span>
            <span>HATE</span>

        </a>


        <a
            href="homepage.html"
            class="back-home"
        >
            ← Back to website
        </a>

    </header>



    <!-- =================================
         REGISTER
    ================================== -->

    <main class="auth-main">

        <div class="auth-card register-card">


            <div class="auth-heading">

                <span class="section-label">
                    JOIN THE MOVEMENT
                </span>


                <h1>
                    Create your
                    <span>account.</span>
                </h1>


                <p>
                    Join Slash the Hate and become
                    part of a community promoting
                    healthier digital conversations.
                </p>

            </div>



            <!-- REGISTER FORM -->

            <form id="registerForm">


                <div class="auth-form-group">

                    <label for="fullName">
                        Full name
                    </label>


                    <input
                        type="text"
                        id="fullName"
                        placeholder="Your name"
                        required
                    >

                </div>



                <div class="auth-form-group">

                    <label for="registerEmail">
                        Email address
                    </label>


                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="you@example.com"
                        required
                    >

                </div>



                <div class="auth-form-group">

                    <label for="username">
                        Username
                    </label>


                    <input
                        type="text"
                        id="username"
                        placeholder="@username"
                        required
                    >

                </div>



                <div class="auth-form-group">

                    <label for="registerPassword">
                        Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            id="showRegisterPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>



                <div class="auth-form-group">

                    <label for="confirmPassword">
                        Confirm password
                    </label>


                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Repeat your password"
                        required
                    >

                </div>



                <label class="terms-option">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >


                    <span>

                        I agree to the
                        <a href="#">
                            community guidelines
                        </a>
                        and responsible-use principles.

                    </span>

                </label>



                <button
                    type="submit"
                    class="auth-submit"
                >
                    Create Account →
                </button>

            </form>



            <div class="auth-divider">

                <span>
                    ALREADY A MEMBER?
                </span>

            </div>


            <div class="auth-register">

                <a href="login.html">
                    Sign in to your account
                </a>

            </div>


        </div>

    </main>



    <footer class="auth-footer">

        <p>
            © 2026 Slash the Hate.
            Educate. Respect. Connect.
        </p>

    </footer>


    <script src="auth.js"></script>

</body>

</html>
